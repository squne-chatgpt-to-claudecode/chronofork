name: validation-pr118-ruler-birth-real
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/validation-pr118-ruler-birth-real.yml

permissions:
  contents: read

jobs:
  real-history-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      CHRONOFORK_E2E_INTEGRATED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test real A0 birth, CROWN and country ruler observations
        run: npx playwright test tests/e2e/pr118-ruler-birth-real.spec.ts --workers=1 --retries=0 --reporter=list
