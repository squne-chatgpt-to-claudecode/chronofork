name: ux-outcome-real-100y
on:
  pull_request:
    paths:
      - .github/workflows/ux-outcome-real-100y.yml

permissions:
  contents: read

jobs:
  real-100y-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      CHRONOFORK_E2E_INTEGRATED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/outcome-first-real.spec.ts --workers=1 --retries=0 --reporter=list
