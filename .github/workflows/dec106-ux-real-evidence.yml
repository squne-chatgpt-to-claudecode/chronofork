name: dec106-ux-real-evidence
on:
  pull_request:
    paths:
      - .github/workflows/dec106-ux-real-evidence.yml
permissions:
  contents: read
jobs:
  a0-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      CHRONOFORK_DEC106_AUDIT: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/dec106-ux-audit.spec.ts --workers=1 --retries=0 --reporter=list
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dec106-a0-browser-evidence
          path: test-results/
          retention-days: 14
